# Production Docker stack (no data seeding)
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - prod-postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_APPLICATION_NAME: clinic-hms-prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_hms
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_SEED_ENABLED: "false"
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      APP_LOGTO_ENABLED: ${APP_LOGTO_ENABLED:-true}
      APP_AUTH_LEGACY_ENABLED: "false"
      APP_SECURITY_COOKIE_SECURE: "true"
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-}
      LOGTO_ISSUER_URI: ${LOGTO_ISSUER_URI:-}
      LOGTO_APP_ID: ${LOGTO_APP_ID:-}
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-}
      FILE_UPLOAD_BASE_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:?VITE_API_BASE is required}
        VITE_CLIENT_ID: prod
        VITE_CLIENT_NAME: "Production"
        VITE_LOGTO_ENABLED: ${VITE_LOGTO_ENABLED:-true}
        VITE_LEGACY_AUTH_ENABLED: "false"
        VITE_APP_ENV: production
    container_name: prod-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  prod-postgres-data:
    driver: local

networks:
  app-network:
    driver: bridge
