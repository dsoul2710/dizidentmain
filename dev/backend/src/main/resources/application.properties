# Application Name - Override with CLIENT_NAME env var
spring.application.name=${SPRING_APPLICATION_NAME:clinic-hms}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# DATASOURCE (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinic_hms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# ===============================
# JPA / HIBERNATE
# ===============================
# Flyway owns schema changes for attribution; override DDL_AUTO=update only for emergency local bootstrap
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:0}
spring.flyway.locations=classpath:db/migration

# ===============================
# LOGGING
# ===============================
# More detailed Hibernate SQL logging (optional)
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# SPRINGDOC / SWAGGER
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================# JWT SECURITY
# ===============================
jwt.secret=${JWT_SECRET:veryLongRandomSecretForHmsClinicJwt_ChangeMe_1234567890}

# ===============================
# SECURITY (U1 hardening)
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}
app.auth.legacy-enabled=${APP_AUTH_LEGACY_ENABLED:true}

# ===============================
# LOGTO IAM (Unit 2)
# ===============================
app.logto.enabled=${APP_LOGTO_ENABLED:true}
app.logto.endpoint=${LOGTO_ENDPOINT:https://npm5w2.logto.app}
app.logto.issuer-uri=${LOGTO_ISSUER_URI:https://npm5w2.logto.app/oidc}
app.logto.api-resource=${LOGTO_API_RESOURCE:http://localhost:8081/api}
app.logto.app-id=${LOGTO_APP_ID:saj00uitdlkjzdu8ebwgq}
app.logto.m2m-app-id=${LOGTO_M2M_APP_ID:}
app.logto.m2m-app-secret=${LOGTO_M2M_APP_SECRET:}
app.logto.webhook-signing-key=${LOGTO_WEBHOOK_SECRET:}
app.logto.management-api-resource=${LOGTO_MANAGEMENT_API_RESOURCE:https://npm5w2.logto.app/api}
app.logto.webhook-verify-enabled=${LOGTO_WEBHOOK_VERIFY_ENABLED:true}
app.logto.management-api-enabled=${LOGTO_MANAGEMENT_API_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.logto.issuer-uri}

# ===============================# ACTUATOR (for future monitoring)
# ===============================
management.endpoints.web.exposure.include=*


# Base upload dimonitoring)
# ===============================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}

# ===============================
# FILE UPLOAD
# ===============================
# Base upload directory - Override per client
file.upload.base-dir=${FILE_UPLOAD_BASE_DIR:D:/dizident/dizidentmain/backend/uploads}

# Enable multipart (usually on by default)
spring.servlet.multipart.enabled=true

# Max size for a single uploaded file
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}

# Max size for the whole request (all files + data)
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}