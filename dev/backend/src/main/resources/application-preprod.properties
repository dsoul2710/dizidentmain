# Pre-production profile — staging / UAT (no seeding)
app.seed.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.logto.enabled=true
app.auth.legacy-enabled=false
app.security.cookie-secure=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info,metrics

# Override via environment:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_PASSWORD, JWT_SECRET,
# APP_CORS_ALLOWED_ORIGINS, LOGTO_*, APP_LOGTO_ENABLED
