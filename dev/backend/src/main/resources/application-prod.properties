# Production profile — no seeding, strict defaults
app.seed.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.logto.enabled=true
app.auth.legacy-enabled=false
app.security.cookie-secure=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info

# Override via environment:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_PASSWORD, JWT_SECRET,
# APP_CORS_ALLOWED_ORIGINS, LOGTO_*, APP_LOGTO_ENABLED
