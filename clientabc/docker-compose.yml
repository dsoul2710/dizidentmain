version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: clientabc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_hms_abc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-abc_secure_password_456}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clientabc-backend
    restart: unless-stopped
    environment:
      SPRING_APPLICATION_NAME: clinic-hms-abc
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_hms_abc
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-abc_secure_password_456}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-abc_change_this_secret_key_98765432109876543210}
      FILE_UPLOAD_BASE_DIR: /app/uploads
    ports:
      - "8082:8080"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8082}
        VITE_CLIENT_ID: clientabc
        VITE_CLIENT_NAME: "ABC Dental Care"
    container_name: clientabc-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local

networks:
  app-network:
    driver: bridge
